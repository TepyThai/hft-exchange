[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/TepyThai/hft-exchange"
rust-version = "1.80"

[workspace.dependencies]
types = { path = "crates/types" }
benchkit = { path = "crates/benchkit" }
sync = { path = "crates/sync" }
telemetry = { path = "crates/telemetry" }
book = { path = "crates/book" }
engine = { path = "crates/engine" }
journal = { path = "crates/journal" }
marketdata = { path = "crates/marketdata" }
wire = { path = "crates/wire" }
fix = { path = "crates/fix" }
risk = { path = "crates/risk" }
gateway = { path = "crates/gateway" }
sim = { path = "crates/sim" }

# The only external dependency in the curriculum crates: the gateway's async
# runtime (week 13). Only the features the gateway uses.
tokio = { version = "1.47", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

# Latency work wants the whole program optimized together and readable
# profiles (line tables) without slowing anything down.
#
# No `panic = "abort"` (week 22): `xtest` and `bench` inherit this profile,
# the week-3 task-set tests check that a panicking thread is reported
# rather than taking the process down, and the gateway (the `exchange`
# binary) relies on unwinding so a panicking session task is dropped while
# the exchange keeps running. An engine-only binary that wants abort gets
# its own profile (`[profile.release-abort]`, `inherits = "release"`).
[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
inherits = "release"

# `cargo xtask test` builds tests optimized (timing-sensitive tests need
# it) but without fat LTO, which would make every test binary slow to link.
[profile.xtest]
inherits = "release"
lto = false
codegen-units = 16
debug = false

# `cargo xtask wasm`: the browser build of the engine (small and fast).
[profile.wasm]
inherits = "release"
debug = false
panic = "abort"
strip = true
